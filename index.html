<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto Telefónico</title>
    <style>
        /* Reseteo básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .call-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .call-container h2 {
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .call-container p {
            margin-bottom: 30px;
            color: #7f8c8d;
            line-height: 1.5;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: #27ae60;
            font-weight: bold;
        }

        .dot {
            height: 10px;
            width: 10px;
            background-color: #27ae60;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(39, 174, 96, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); }
        }

        /* El contenedor donde se inyectará el widget de Zadarma si decides usar un botón personalizado */
        #zadarma-widget-container {
            margin-top: 20px;
            min-height: 50px; 
        }
    </style>
</head>
<body>

    <div class="call-container">
        <div class="status-indicator">
            <span class="dot"></span> Líneas operativas
        </div>
        <h2>Soporte en Línea</h2>
        <p>Haz clic en el botón de abajo para comunicarte con nosotros directamente desde tu navegador. La llamada es totalmente gratuita.</p>

        <div id="zadarma-widget-container">
            <!-- ========================================== -->
            <!-- PEGA AQUÍ EL SCRIPT QUE TE ENTREGA ZADARMA -->
            <!-- ========================================== -->
            
            <!-- Ejemplo de cómo lucirá: -->
            <!-- <script src="https://my.zadarma.com/call-us/script.js" type="text/javascript"></script> -->
        </div>
    </div>

</body>
</html>
